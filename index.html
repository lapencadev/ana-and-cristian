<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ana & Cristian</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="container">
    <header class="couple">
      <h1>ANA &amp; CRISTIAN</h1>
      <p>13 · 06 · 2026</p>
    </header>

    <section class="countdown" aria-label="Cuenta regresiva para la boda">
      <div class="time-box">
        <div class="number" id="days">0</div>
        <div class="label">Dias</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">0</div>
        <div class="label">Horas</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">0</div>
        <div class="label">Minutos</div>
      </div>
      <div class="time-box">
        <div class="number" id="seconds">0</div>
        <div class="label">Segundos</div>
      </div>
    </section>

    <section class="monthly-egg" id="monthlyEgg" aria-live="polite"></section>

    <section class="magic-text" id="magicText" aria-live="polite"></section>
  </main>

  <footer class="footer-logo">
    <img src="comite-ana-sf.png" alt="Comite Ana" />
  </footer>

  <script src="main.js"></script>
</body>
</html>
